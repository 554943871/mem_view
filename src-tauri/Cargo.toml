[package]
name = "mem-view"
version = "0.2.41"
description = "A local viewer and manual Git refresher for mem repositories"
authors = ["god"]
edition = "2021"

[lib]
name = "mem_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mem-view"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSError", "NSObject"] }
objc2-web-kit = { version = "0.3", features = ["WKSnapshotConfiguration", "WKWebView", "block2", "objc2-core-foundation"] }
